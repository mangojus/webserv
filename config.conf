server
{
    listen 8080;
	server_name webserv.localhost;
	allowed_methods GET POST DELETE;

	root www/html;	
}

server
{
    listen 8080 backlog=50;

	server_name default;
	root www/webserv.com/html;
	index index.html;
	autoindex on;

	allowed_methods GET DELETE;

	client_max_body_size 24000;

	location / {
	}

	location /contact {
		allowed_methods GET POST;
		index index.html;
		autoindex off;
	}

	location /redirect
	{
		return 301 http://google.com;
		autoindex off;
	}

	location /upload {
		allowed_methods GET POST DELETE;
	}

	location /cgi-bin {
		root www/webserv.com;
		allowed_methods GET POST;

		cgi;
		cgi_extension .py;
		cgi_pass /usr/bin/python3;
	}

	location /data{
		root www/webserv.com;
	}
	
	location /python {
		root www/webserv.com;
		allowed_methods GET POST;

        cgi;
        cgi_extension .py;
        cgi_pass /usr/bin/python3;
    }

	location /php {
		root www/webserv.com;
		allowed_methods GET POST;

		cgi;
		cgi_extension .php;
		cgi_pass /usr/bin/php;
	}

	location /perl {
		root www/webserv.com;
		allowed_methods GET POST;

		cgi;
		cgi_extension .pl;
		cgi_pass /usr/bin/perl;
	}

	error_page 400 errors/400.html;
	error_page 403 errors/403.html;
	error_page 404 errors/404.html;
	error_page 405 errors/405.html;
	error_page 413 errors/413.html;
	error_page 500 errors/500.html;
}

server
{
    listen 8080 backlog=50;
 
    server_name gallery.localhost;
 
    root www/gallery.com/html;
    index index.html;
 
    allowed_methods GET POST DELETE;
 
    client_max_body_size 10485760000;
	autoindex off;
 
    location / {
    }
 
    location /cgi-bin {
        root www/gallery.com;
        allowed_methods GET POST DELETE;
 
        cgi;
        cgi_extension .py;
        cgi_pass /usr/bin/python3;
    }
 
    location /gallery {
        allowed_methods GET POST DELETE ;
		autoindex on;
    }
 
    error_page 400 errors/400.html;
    error_page 403 errors/403.html;
    error_page 404 errors/404.html;
    error_page 405 errors/405.html;
    error_page 413 errors/413.html;
    error_page 500 errors/500.html;
}
